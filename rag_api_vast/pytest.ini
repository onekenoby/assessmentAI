[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    asyncio: test asincrono eseguito tramite pytest-asyncio
    integration: test di integrazione su servizi reali PostgreSQL, Qdrant, Neo4j e Ollama

filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:DeprecationWarning